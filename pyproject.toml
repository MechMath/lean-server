[project]
name = "lean-server"
version = "0.1.0"
description = "A minimal HTTP compilation service for Lean 4.30"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lean-server = "lean_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lean_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
